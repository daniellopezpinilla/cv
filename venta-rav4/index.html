<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Toyota RAV4 Híbrida XLE 2023 — En venta</title>
  <style>
    :root {
      --ink: #121416;
      --mist: #f4f4f2;
      --steel: #78848e;
      --accent: #c44a34;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--mist);
      color: var(--ink);
    }
    header {
      background: var(--ink);
      color: #fff;
      padding: 1.25rem 1.5rem;
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: center;
      justify-content: space-between;
    }
    header h1 {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 650;
      letter-spacing: 0.01em;
    }
    header p {
      margin: 0.25rem 0 0;
      color: #b8c0c8;
      font-size: 0.9rem;
    }
    .btn {
      display: inline-block;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      padding: 0.75rem 1.15rem;
      border-radius: 6px;
      font-weight: 650;
      font-size: 0.95rem;
    }
    .btn:hover { filter: brightness(1.08); }
    main {
      max-width: 920px;
      margin: 0 auto;
      padding: 1.5rem;
    }
    .meta {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }
    .chip {
      background: #fff;
      border: 1px solid #e4e4e0;
      border-radius: 8px;
      padding: 0.75rem 0.9rem;
    }
    .chip span {
      display: block;
      color: var(--steel);
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 0.2rem;
    }
    .chip strong { font-size: 1rem; }
    figure {
      margin: 0 0 1.25rem;
      background: #fff;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid #e4e4e0;
    }
    figure img {
      display: block;
      width: 100%;
      height: auto;
    }
    figcaption {
      padding: 0.65rem 0.9rem;
      font-size: 0.85rem;
      color: var(--steel);
    }
    footer {
      margin-top: 1rem;
      padding: 1rem 0 2rem;
      color: var(--steel);
      font-size: 0.95rem;
    }
    footer a { color: var(--ink); font-weight: 650; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Toyota RAV4 Híbrida XLE 2023</h1>
      <p>36.500 km · $210.000.000 COP · En venta</p>
    </div>
    <a class="btn" href="./Toyota_RAV4_Hibrida_XLE_2023.pdf" download>
      Descargar PDF
    </a>
  </header>
  <main>
    <div class="meta">
      <div class="chip"><span>Año</span><strong>2023</strong></div>
      <div class="chip"><span>Kilometraje</span><strong>36.500 km</strong></div>
      <div class="chip"><span>Versión</span><strong>XLE Hybrid AWD</strong></div>
      <div class="chip"><span>Precio</span><strong>$210 M</strong></div>
    </div>
    <figure>
      <img src="./pagina1.png" alt="Portada del PDF de venta" />
      <figcaption>Página 1 — Portada</figcaption>
    </figure>
    <figure>
      <img src="./pagina2.png" alt="Galería y ficha técnica del PDF" />
      <figcaption>Página 2 — Galería y ficha</figcaption>
    </figure>
    <footer>
      Contacto: <strong>Humberto Velázquez</strong> ·
      Cel / WhatsApp:
      <a href="https://wa.me/573204608287">320 460 8287</a>
    </footer>
  </main>
</body>
</html>
